
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7f5">
    <meta name="description" content="Sistema de control contable, ventas, caja, egresos y cuentas.">
    <title>Control Contable | Administración</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link href="css/app.css" rel="stylesheet">
</head>
<body>

<div class="sistema">

    <!-- ========== BARRA SUPERIOR ========== -->
    <header class="barra-superior">
        <button type="button" class="btn-icono" id="btnInicio" title="Ir al inicio" aria-label="Ir al inicio">
            <i class="bi bi-house"></i>
        </button>

        <div class="barra-centro">
            <!-- Logo / nombre inicial -->
            <div class="marca-sistema" id="marcaSistema">
                <span class="marca-icono"><i class="bi bi-wallet2"></i></span>
                <strong>Control Contable</strong>
            </div>

            <!-- Navegación de submódulos -->
            <nav id="navSubmodulos" class="nav-submodulos d-none" aria-label="Submódulos"></nav>
        </div>

        <button type="button" class="btn-icono" id="btnConfiguracion" title="Configuración" aria-label="Configuración">
            <i class="bi bi-gear"></i>
        </button>
    </header>

    <!-- ========== CONTENIDO PRINCIPAL ========== -->
    <main class="contenedor-principal">

        <!-- ========== PANTALLA DE INICIO ========== -->
        <section id="vistaInicio" class="vista-inicio">
            <div class="inicio-contenido">

                <div class="text-center mb-4">
                    <span class="etiqueta-verde">ADMINISTRACIÓN DEL NEGOCIO</span>
                    <h1 class="titulo-principal">¿Qué deseas hacer?</h1>
                    <p class="texto-secundario mb-0">Selecciona un módulo para comenzar.</p>
                </div>

                <div class="grid-modulos">

                    <!-- MÓDULO 1: VENTAS -->
                    <button type="button" class="tarjeta-modulo js-abrir-modulo" data-modulo="ventas">
                        <span class="modulo-icono">
                            <i class="bi bi-receipt"></i>
                        </span>
                        <strong>Ventas</strong>
                        <small>Registro de ventas con nota y ventas rápidas.</small>
                    </button>

                    <!-- MÓDULO 2: CAJA Y EGRESOS -->
                    <button type="button" class="tarjeta-modulo js-abrir-modulo" data-modulo="caja">
                        <span class="modulo-icono">
                            <i class="bi bi-wallet2"></i>
                        </span>
                        <strong>Caja y egresos</strong>
                        <small>Control de efectivo, arqueos, gastos y salidas.</small>
                    </button>

                    <!-- MÓDULO 3: CUENTAS -->
                    <button type="button" class="tarjeta-modulo js-abrir-modulo" data-modulo="cuentas">
                        <span class="modulo-icono">
                            <i class="bi bi-people"></i>
                        </span>
                        <strong>Cuentas</strong>
                        <small>Créditos, abonos y pagos pendientes a proveedores.</small>
                    </button>

                    <!-- MÓDULO 4: PANEL Y REPORTES -->
                    <button type="button" class="tarjeta-modulo js-abrir-modulo" data-modulo="panel">
                        <span class="modulo-icono">
                            <i class="bi bi-bar-chart-line"></i>
                        </span>
                        <strong>Panel y reportes</strong>
                        <small>Indicadores, movimientos y análisis financiero.</small>
                    </button>

                </div>
            </div>
        </section>

        <!-- ========== PANTALLA DE SUBMÓDULOS ========== -->
        <section id="vistaModulo" class="vista-modulo d-none">

            <!-- Encabezado del submódulo -->
            <div class="encabezado-modulo">
                <div class="d-flex align-items-center gap-3">

                    <span class="encabezado-icono">
                        <i id="iconoPantalla" class="bi bi-receipt"></i>
                    </span>

                    <div>
                        <span class="etiqueta-verde" id="categoriaModulo"></span>
                        <h1 id="tituloPantalla" class="h4 fw-bold mb-1"></h1>
                        <p id="descripcionPantalla" class="texto-secundario mb-0"></p>
                    </div>

                </div>
            </div>

            <!-- Aquí cargaremos los formularios de cada módulo -->
            <div class="contenido-modulo" id="contenidoModulo">
                <!--<div class="estado-vacio">
                    <i class="bi bi-ui-checks-grid"></i>
                    <h2 class="h5 mt-3">Área lista para desarrollar</h2>
                    <p class="texto-secundario mb-0">Aquí construiremos el formulario correspondiente.</p>
                </div>-->
            </div>

        </section>

    </main>
</div>


<!-- VENTAS CON NOTA -->
<template id="tplVentaNota">
<form id="formVentaNota" novalidate>
    <div class="row g-3">
        <div class="col-xl-8">

            <section class="nota-bloque mb-3">
                <div class="nota-seccion-titulo">
                    <i class="bi bi-person-vcard"></i>
                    <div><h2>Datos de la nota</h2><small>Cliente y responsable de la venta.</small></div>
                </div>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="notaFolio">Número de nota</label>
                        <input id="notaFolio" data-campo-nota="folio" class="form-control" maxlength="50" placeholder="Automático al guardar">
                        <div class="form-text">Opcional. Puedes indicar un folio específico.</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="notaVendedor">Vendedor *</label>
                        <input id="notaVendedor" data-campo-nota="vendedor" class="form-control" maxlength="100" placeholder="Nombre del vendedor" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Fecha y hora</label>
                        <div class="form-control nota-solo-lectura">Al guardar la nota</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="notaCliente">Cliente *</label>
                        <input id="notaCliente" data-campo-nota="cliente" class="form-control" maxlength="100" placeholder="Nombre completo o razón social" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="notaTelefono">Teléfono (opcional)</label>
                        <input id="notaTelefono" data-campo-nota="telefono" class="form-control" maxlength="50" inputmode="tel" placeholder="Número de contacto">
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="notaDireccion">Dirección de entrega (opcional)</label>
                        <input id="notaDireccion" data-campo-nota="direccion" class="form-control" maxlength="255" placeholder="Calle, número, colonia y referencias">
                    </div>
                </div>
            </section>

            <section class="nota-bloque mb-3">
                <div class="nota-seccion-titulo justify-content-between flex-wrap">
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi bi-basket"></i>
                        <div><h2>Artículos de la venta</h2><small>Agrega productos o conceptos manualmente.</small></div>
                    </div>
                    <button type="button" id="btnAgregarItemNota" class="btn btn-success btn-sm">
                        <i class="bi bi-plus-lg me-1"></i>Agregar artículo
                    </button>
                </div>
                <div class="table-responsive">
                    <table class="table nota-tabla align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Descripción del producto</th>
                                <th>Cantidad</th>
                                <th>Precio unitario</th>
                                <th>Importe</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="detalleVentaNota"></tbody>
                    </table>
                </div>
                <p class="text-secondary small mt-3 mb-0">
                    <i class="bi bi-info-circle me-1"></i>Captura manual sin descontar inventario.
                </p>
            </section>

            <section class="nota-bloque mb-3">
                <div class="nota-seccion-titulo">
                    <i class="bi bi-credit-card"></i>
                    <div><h2>Forma de pago</h2><small>Indica cómo se realizará el cobro.</small></div>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="notaFormaPago">Modalidad *</label>
                        <select id="notaFormaPago" data-campo-nota="forma_pago" class="form-select">
                            <option value="EFECTIVO">Efectivo</option>
                            <option value="TRANSFERENCIA">Transferencia</option>
                            <option value="CREDITO">Crédito</option>
                            <option value="PARCIALIDADES">Parcialidades</option>
                        </select>
                    </div>

<div class="col-md-6 d-none" id="notaCajaBox">
    <label class="form-label" for="notaCaja">Caja donde se recibe el efectivo *</label>
    <select id="notaCaja" data-campo-nota="caja_id" class="form-select">
        <option value="">Consultando cajas...</option>
    </select>
    <div class="form-text">El cobro se agregará al saldo de la caja seleccionada.</div>
</div>

                    <div class="col-md-6 d-none" id="notaReferenciaBox">
                        <label class="form-label" for="notaReferencia">Referencia bancaria (opcional)</label>
                        <input id="notaReferencia" data-campo-nota="referencia" class="form-control" maxlength="100" placeholder="Número de comprobante">
                    </div>
                    <div class="col-12 d-none" id="notaParcialidadBox">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="notaAbono">Abono inicial *</label>
                                <input id="notaAbono" data-campo-nota="abono" type="number" min="0.01" step="0.01" inputmode="decimal" class="form-control" placeholder="0.00">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="notaMetodoAbono">Método del abono</label>
                                <select id="notaMetodoAbono" data-campo-nota="metodo_abono" class="form-select">
                                    <option value="EFECTIVO">Efectivo</option>
                                    <option value="TRANSFERENCIA">Transferencia</option>
                                </select>
                            </div>
                            <div class="col-12 d-none" id="notaRefAbonoBox">
                                <label class="form-label" for="notaRefAbono">Referencia del abono (opcional)</label>
                                <input id="notaRefAbono" data-campo-nota="referencia_abono" class="form-control" maxlength="100" placeholder="Referencia de transferencia">
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="notaObservaciones">Observaciones (opcional)</label>
                        <textarea id="notaObservaciones" data-campo-nota="observaciones" class="form-control" rows="2" maxlength="500" placeholder="Indicaciones o comentarios"></textarea>
                    </div>
                </div>
            </section>
        </div>

        <div class="col-xl-4">
            <aside class="nota-bloque nota-resumen">
                <div class="nota-seccion-titulo">
                    <i class="bi bi-calculator"></i>
                    <div><h2>Resumen de venta</h2><small>Importes calculados automáticamente.</small></div>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span class="text-secondary">Total</span><strong id="notaTotal" aria-live="polite">$0.00</strong>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span class="text-secondary">Recibido</span><strong id="notaAbonado">$0.00</strong>
                </div>
                <hr>
                <div class="d-flex justify-content-between align-items-center gap-2">
                    <strong>Saldo pendiente</strong><strong class="nota-saldo" id="notaSaldo">$0.00</strong>
                </div>
                <div class="alert alert-light border small mt-4">
                   
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
                    <i class="bi bi-clipboard-check me-2"></i>Revisar nota
                </button>
                <button type="button" id="btnLimpiarVentaNota" class="btn btn-outline-secondary w-100 mt-2">Limpiar formulario</button>
            </aside>
        </div>
    </div>
</form>
</template>

<!-- RENGLÓN REUTILIZABLE -->
<template id="tplFilaVentaNota">
    <tr>
        <td data-label="Código">
            <input class="form-control form-control-sm" data-item-campo="codigo" maxlength="80" placeholder="Opcional" aria-label="Código del artículo">
        </td>
        <td data-label="Descripción">
            <input class="form-control form-control-sm" data-item-campo="nombre" maxlength="200" placeholder="Nombre del artículo" aria-label="Nombre del artículo">
        </td>
        <td data-label="Cantidad">
            <input type="number" class="form-control form-control-sm" data-item-campo="cantidad" min="0.01" step="0.01" inputmode="decimal" aria-label="Cantidad">
        </td>
        <td data-label="Precio unitario">
            <input type="number" class="form-control form-control-sm" data-item-campo="precio" min="0" step="0.01" inputmode="decimal" placeholder="0.00" aria-label="Precio unitario">
        </td>
        <td data-label="Importe"><strong class="nota-importe-fila text-nowrap">—</strong></td>
        <td data-label="Acción">
            <button type="button" class="btn btn-outline-danger btn-sm btnEliminarItemNota" title="Quitar artículo" aria-label="Quitar artículo"><i class="bi bi-trash"></i></button>
        </td>
    </tr>
</template>


<!-- VENTA RÁPIDA -->
<template id="tplVentaRapida">
<form id="formVentaRapida" novalidate>
    <div class="row g-3">
        <div class="col-xl-8">
            <section class="nota-bloque mb-3">
                <div class="nota-seccion-titulo justify-content-between flex-wrap">
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi bi-cart3"></i>
                        <div>
                            <h2>Venta de mostrador</h2>
                            <small>Captura los artículos y realiza el cobro.</small>
                        </div>
                    </div>
                    <span class="badge rounded-pill text-success bg-success-subtle border border-success-subtle px-3 py-2">Sin nota</span>
                </div>
                <div class="alert alert-light border rounded-3 small mb-0">
                    <i class="bi bi-clock me-2 text-success"></i>La fecha y hora se asignarán automáticamente al guardar la venta.
                </div>
            </section>

            <section class="nota-bloque mb-3">
                <div class="nota-seccion-titulo justify-content-between flex-wrap">
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi bi-basket"></i>
                        <div>
                            <h2>Artículos de la venta</h2>
                            <small>Ingresa código, descripción, cantidad y precio.</small>
                        </div>
                    </div>
                    <button type="button" id="btnAgregarItemRapida" class="btn btn-success btn-sm">
                        <i class="bi bi-plus-lg me-1"></i>Agregar artículo
                    </button>
                </div>
                <div class="table-responsive">
                    <table class="table nota-tabla align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Descripción</th>
                                <th>Cantidad</th>
                                <th>Precio unitario</th>
                                <th>Importe</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="detalleVentaRapida"></tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 pt-3">
                    <small class="text-secondary"><i class="bi bi-info-circle me-1"></i>Los artículos manuales no afectan inventario.</small>
                    <span class="small fw-semibold" id="rapidaCantidadItems">0 artículos</span>
                </div>
            </section>

            <section class="nota-bloque mb-3">
                <div class="nota-seccion-titulo">
                    <i class="bi bi-credit-card"></i>
                    <div>
                        <h2>Forma de cobro</h2>
                        <small>Selecciona cómo recibes el pago.</small>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-sm-6">
                        <input type="radio" class="btn-check rapida-pago-input" name="metodoVentaRapida" id="rapidaPagoEfectivo" value="EFECTIVO" checked>
                        <label class="rapida-pago-label" for="rapidaPagoEfectivo">
                            <i class="bi bi-cash-stack"></i>
                            <span><strong>Efectivo</strong><small>Pago en caja</small></span>
                            <i class="bi bi-check-circle-fill rapida-pago-check"></i>
                        </label>
                    </div>
                    <div class="col-sm-6">
                        <input type="radio" class="btn-check rapida-pago-input" name="metodoVentaRapida" id="rapidaPagoTransferencia" value="TRANSFERENCIA">
                        <label class="rapida-pago-label" for="rapidaPagoTransferencia">
                            <i class="bi bi-bank"></i>
                            <span><strong>Transferencia</strong><small>Pago bancario</small></span>
                            <i class="bi bi-check-circle-fill rapida-pago-check"></i>
                        </label>
                    </div>

<div class="col-12 d-none" id="rapidaCajaBox">
    <label class="form-label" for="rapidaCaja">Caja donde se recibirá el efectivo *</label>
    <select id="rapidaCaja" class="form-select">
        <option value="">Consultando cajas...</option>
    </select>
    <div class="form-text">El importe se sumará al saldo de la caja seleccionada.</div>
</div>

                    <div class="col-12 d-none" id="rapidaReferenciaBox">
                        <label class="form-label" for="rapidaReferencia">Referencia bancaria (opcional)</label>
                        <input class="form-control" id="rapidaReferencia" data-campo-rapida="referencia" maxlength="100" placeholder="Número de operación o comprobante">
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="rapidaObservaciones">Observaciones (opcional)</label>
                        <textarea class="form-control" id="rapidaObservaciones" data-campo-rapida="observaciones" rows="2" maxlength="500" placeholder="Comentarios adicionales"></textarea>
                    </div>
                </div>
            </section>
        </div>

        <div class="col-xl-4">
            <aside class="nota-bloque nota-resumen">
                <div class="nota-seccion-titulo">
                    <i class="bi bi-calculator"></i>
                    <div><h2>Resumen de cobro</h2><small>Importe calculado automáticamente.</small></div>
                </div>
                <div class="rapida-total-box mb-4">
                    <small>Total a cobrar</small>
                    <strong id="rapidaTotal" aria-live="polite">$0.00</strong>
                </div>
                <div class="d-flex justify-content-between mb-3 gap-2">
                    <span class="text-secondary small">Artículos</span>
                    <strong id="rapidaItemsResumen">0</strong>
                </div>
                <div class="d-flex justify-content-between mb-3 gap-2">
                    <span class="text-secondary small">Método</span>
                    <strong id="rapidaMetodoResumen">Efectivo</strong>
                </div>
                <hr>
                <div class="d-flex justify-content-between align-items-center gap-2 mb-4">
                    <span class="fw-semibold">Saldo pendiente</span>
                    <strong class="text-success">$0.00</strong>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
                    <i class="bi bi-check2-circle me-2"></i>Revisar venta
                </button>
                <button type="button" id="btnLimpiarVentaRapida" class="btn btn-outline-secondary w-100 mt-2">Nueva venta / Limpiar</button>
                <p class="text-secondary small text-center mt-3 mb-0">Vista previa. Todavía no se guarda en MySQL.</p>
            </aside>
        </div>
    </div>
</form>
</template>

<template id="tplControlCaja">
    <section class="nota-bloque mb-3">
        <div class="nota-seccion-titulo"><i class="bi bi-wallet2"></i><div><h2>Control de efectivo</h2><small>Consulta, abre y cierra tus turnos de caja.</small></div></div>
        <div class="row g-3 align-items-end">
            <div class="col-md-6"><label class="form-label" for="cajaSeleccionada">Seleccionar caja</label><select id="cajaSeleccionada" class="form-select"></select></div>
            <div class="col-md-6"><span id="cajaEstado" class="small text-secondary"></span></div>
        </div>
        <div id="sinCajas" class="alert alert-warning mt-3 d-none">No hay cajas activas configuradas.</div>
    </section>
    <div class="row g-3 mb-3" id="cajaResumen"></div>
    <div class="row g-3 mb-3">
        <div class="col-lg-6">
            <section class="nota-bloque h-100" id="panelAbrirCaja">
                <div class="nota-seccion-titulo"><i class="bi bi-play-circle"></i><div><h2>Apertura de caja</h2><small>Registra el dinero inicial del turno.</small></div></div>
                <form id="formAperturaCaja">
                    <label for="fondoCaja" class="form-label">Fondo inicial ($)</label>
                    <input id="fondoCaja" class="form-control" type="number" min="0" step="0.01" required>
                    <p class="form-text">Si el fondo difiere del saldo anterior, se registrará un ajuste antes de abrir el turno.</p>
                    <button type="submit" class="btn btn-success mt-2"><i class="bi bi-unlock me-2"></i>Abrir caja</button>
                </form>
            </section>
        </div>
        <div class="col-lg-6">
            <section class="nota-bloque h-100 d-none" id="panelCerrarCaja">
                <div class="nota-seccion-titulo"><i class="bi bi-lock"></i><div><h2>Arqueo y cierre</h2><small>Verifica el dinero físico al terminar.</small></div></div>
                <p>Efectivo esperado: <strong id="cajaEsperado" data-valor="0">$0.00</strong></p>
                <!--<form id="formCierreCaja">
                    <label for="contadoCaja" class="form-label">Efectivo contado ($)</label>
                    <input id="contadoCaja" class="form-control" type="number" min="0" step="0.01" required>
                    <button type="submit" class="btn btn-success mt-3"><i class="bi bi-check-circle me-2"></i>Cerrar caja</button>
                </form>-->


<form id="formCierreCaja">
    <div class="mb-3">
        <div class="d-flex align-items-center gap-2 mb-1">
            <i class="bi bi-cash-stack text-success"></i>
            <h3 class="h6 fw-bold mb-0">Desglose de efectivo</h3>
        </div>
        <p class="small text-secondary mb-3">
            Captura cuántas piezas tienes de cada denominación.
            El total se calculará automáticamente.
        </p>
        <div id="denominacionesCaja" class="row g-2"></div>
    </div>

    <div class="border rounded-4 p-3 mt-3 bg-light">
        <label for="contadoCaja" class="form-label fw-semibold">
            Efectivo contado
        </label>
        <input id="contadoCaja" type="number" class="form-control fw-bold"
               value="0.00" min="0" step="0.01" readonly required>

        <div class="d-flex justify-content-between gap-2 mt-3">
            <span class="text-secondary small">Diferencia del arqueo</span>
            <strong id="diferenciaArqueoCaja">$0.00</strong>
        </div>
