<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías | Sistema CSM</title>

    <script>
        try {
            document.documentElement.setAttribute('data-bs-theme',
                localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
        } catch (e) {
            document.documentElement.setAttribute('data-bs-theme', 'light');
        }
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/theme-global.css">
    <link rel="stylesheet" href="assets/css/categorias.css">
</head>
<body>
    
<main class="container-fluid p-3 p-md-4 csm-categorias-modal">

    <!-- LISTADO DE CATEGORÍAS -->
    <section id="categoriasPanelLista">

        <div class="row g-3 align-items-end mb-3">
            <div class="col-12 col-md-4">
                <label for="categoriasTipo" class="form-label">Tipo de categoría</label>
                <select id="categoriasTipo" class="form-select">
                    <option value="1">Productos</option>
                    <option value="2">Clientes</option>
                    <option value="3">Proveedores</option>
                    <option value="4">Servicios</option>
                </select>
            </div>

            <div class="col-12 col-md-8">
                <label for="categoriasBuscar" class="form-label">Buscar categoría</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input id="categoriasBuscar" class="form-control" type="search" placeholder="Nombre o descripción..." autocomplete="off">
                    <button id="categoriasBuscarBtn" type="button" class="btn csm-cat-btn">Buscar</button>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <div class="d-flex align-items-center gap-2">
                <span class="fw-semibold">Categorías registradas</span>
                <div class="btn-group csm-cat-view" role="group" aria-label="Cambiar vista">
                    <button id="categoriasVistaTarjetas" class="btn btn-sm btn-outline-secondary active" type="button" aria-pressed="true" title="Vista tarjetas">
                        <i class="bi bi-grid"></i>
                    </button>
                    <button id="categoriasVistaLista" class="btn btn-sm btn-outline-secondary" type="button" aria-pressed="false" title="Vista lista">
                        <i class="bi bi-list-ul"></i>
                    </button>
                </div>
            </div>

            <button id="categoriasNuevoBtn" class="btn csm-cat-btn" type="button">
                <i class="bi bi-plus-lg"></i> Nueva categoría
            </button>
        </div>

        <div id="categoriasCargando" class="text-center py-3 d-none" role="status">
            <span class="spinner-border spinner-border-sm text-success me-2"></span>
            Consultando categorías...
        </div>

        <!-- VISTA DE TARJETAS -->
       <div id="categoriasTarjetas" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-2"></div>

        <!-- VISTA DE LISTA -->
        <div id="categoriasTablaWrap" class="table-responsive csm-cat-table-wrap d-none">
            <table id="categoriasTabla" class="table align-middle mb-0">
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th>Fecha de alta</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- PAGINACIÓN -->
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mt-4">
            <small id="categoriasConteo" class="text-body-secondary" role="status" aria-live="polite">Cargando...</small>

            <div class="d-flex align-items-center gap-2">
                <label for="categoriasLimite" class="small text-body-secondary">Por página</label>
                <select id="categoriasLimite" class="form-select form-select-sm" style="width:auto">
                    <option value="12">12</option>
                    <option value="24">24</option>
                    <option value="48">48</option>
                </select>
            </div>

            <nav id="categoriasPaginacion" class="d-flex align-items-center flex-wrap gap-1" aria-label="Páginas de categorías"></nav>
        </div>

    </section>

    <!-- FORMULARIO PARA REGISTRAR Y EDITAR -->
    <section id="categoriasPanelFormulario" class="d-none">

        <button id="categoriasVolverBtn" class="btn btn-sm btn-link csm-cat-back px-0 mb-3" type="button">
            <i class="bi bi-arrow-left"></i> Volver a las categorías
        </button>

        <h2 id="categoriasFormTitulo" class="h5 fw-bold mb-3">Nueva categoría</h2>

        <form id="categoriasForm" novalidate>
            <input id="categoriaId" type="hidden">

            <div class="row g-3">
                <div class="col-12 col-md-8">
                    <label for="categoriaNombre" class="form-label">
                        Nombre de la categoría <span class="text-danger">*</span>
                    </label>
                    <input id="categoriaNombre" class="form-control" type="text" maxlength="120" placeholder="Ej. Conexiones de plástico" required>
                </div>

                <div class="col-12 col-md-4">
                    <label for="categoriaTipoEtiqueta" class="form-label">Pertenece al módulo</label>
                    <input id="categoriaTipoEtiqueta" class="form-control" type="text" readonly>
                </div>

                <div class="col-12">
                    <label for="categoriaDescripcion" class="form-label">
                        Descripción <span class="text-body-secondary fw-normal">(opcional)</span>
                    </label>
                    <textarea id="categoriaDescripcion" class="form-control" rows="3" maxlength="5000" placeholder="Describe brevemente qué elementos pertenecen a esta categoría..."></textarea>
                </div>

                <div class="col-12">
                    <label for="categoriaArchivo" class="form-label">
                        Imagen de la categoría <span class="text-body-secondary fw-normal">(opcional)</span>
                    </label>

                    <div class="csm-cat-upload">
                        <div class="csm-cat-preview">
                            <img id="categoriaImagenPreview" class="d-none" alt="Vista previa de la categoría">
                            <span id="categoriaImagenVacia"><i class="bi bi-image"></i></span>
                        </div>

                        <div class="flex-grow-1">
                            <input id="categoriaArchivo" class="form-control" type="file" accept="image/jpeg,image/png,image/webp">
                            <small class="text-body-secondary d-block mt-2">JPG, PNG o WebP. Tamaño máximo: 3 MB.</small>
                            <button id="categoriaQuitarImagen" class="btn btn-sm btn-outline-danger mt-2" type="button" disabled>
                                <i class="bi bi-x-circle"></i> Quitar imagen
                            </button>
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <div class="csm-cat-active">
                        <div>
                            <label class="fw-semibold" for="categoriaActivo">Categoría activa</label>
                            <div class="small text-body-secondary">
                                Las categorías inactivas no aparecerán al seleccionar una categoría para nuevos registros.
                            </div>
                        </div>

                        <div class="form-check form-switch m-0">
                            <input id="categoriaActivo" class="form-check-input" type="checkbox" role="switch" checked>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <button id="categoriasCancelarBtn" class="btn btn-outline-secondary" type="button">Cancelar</button>
                <button id="categoriaGuardarBtn" class="btn csm-cat-btn" type="submit">
                    <i class="bi bi-check2-circle"></i> Guardar categoría
                </button>
            </div>
        </form>

    </section>

</main>


    <script src="assets/js/main.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/categorias.js"></script>
</body>
</html>
