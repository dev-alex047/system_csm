<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio | Sistema CSM</title>

  <script>
    try {
      document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
    } catch (e) {
      document.documentElement.setAttribute('data-bs-theme', 'light');
    }
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/theme-global.css" rel="stylesheet">
  <link href="assets/css/csm-portal.css" rel="stylesheet">
</head>
<body class="csm-portal" data-csm-page="dashboard">
  <div class="container-fluid px-3 px-md-4 py-3">
    <header id="csmHeader"></header>

    <main class="csm-main" id="mainContent">
      <div class="csm-intro text-center">
        <span class="csm-eyebrow">Panel principal</span>
        <h1 class="csm-page-title">Bienvenido al Sistema CSM</h1>
        <p class="csm-page-subtitle">Selecciona el área que deseas gestionar.</p>
      </div>

      <div class="row g-3 g-lg-4 justify-content-center" id="csmModuleGrid" aria-label="Módulos principales"></div>
    </main>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/csm-portal.js"></script>
</body>
</html>
