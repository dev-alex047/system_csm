<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1f3f2">
  <title>Consultar precios | Sistema CSM</title>
  <script>try { document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'); } catch(e) { document.documentElement.setAttribute('data-bs-theme', 'light'); }</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/theme-global.css">
  <link rel="stylesheet" href="assets/css/modules-styles.css">
  <link rel="stylesheet" href="assets/css/price-consultation.css">
</head>
<body class="csm-price-consultation">
  <div class="pc-shell">
    <header class="pc-topbar">
      <a class="pc-brand" href="login.html" aria-label="Ir al acceso del Sistema CSM">
        <span class="pc-brand-image"><img src="../backend/uploads/logo.png" alt="" onerror="this.style.display='none'"></span>
        <span><strong>CORPORATIVO SAN MARTÍN</strong><small>Sistema CSM</small></span>
      </a>
      <a class="pc-toplink" href="login.html"><i class="bi bi-arrow-left" aria-hidden="true"></i><span>Volver al acceso</span></a>
    </header>
    <main class="pc-main">
      <section class="pc-intro" aria-labelledby="pageTitle">
        <h1 id="pageTitle">Consulta de precios <span>al instante.</span></h1>
        <p>Busca por nombre, código o código de barras y consulta su precio actualizado.</p>
      </section>
      <section class="pc-search-panel" aria-label="Buscar un producto">
        <label class="pc-search-label" for="searchInput"><i class="bi bi-search" aria-hidden="true"></i> ¿Qué producto buscas?</label>
        <div class="pc-search-box search-box">
          <i class="bi bi-search pc-search-icon" aria-hidden="true"></i>
          <input id="searchInput" class="form-control" type="search" placeholder="Nombre, clave o código de barras..." aria-label="Buscar por nombre, clave o código de barras" aria-autocomplete="list" aria-controls="autocompleteList" aria-expanded="false" autocomplete="off" enterkeyhint="search">
          <div class="autocomplete-list" id="autocompleteList" role="listbox" aria-label="Productos encontrados"></div>
        </div>
        <div class="pc-search-foot"><span><i class="bi bi-lightbulb" aria-hidden="true"></i> Escribe al menos 2 caracteres para ver sugerencias.</span><span id="searchStatus" role="status" aria-live="polite"></span></div>
        <div class="error-message" id="errorMessage" role="alert"></div>
      </section>
      <div id="resultContainer" aria-live="polite"></div>
      <footer class="pc-footer"><span><i class="bi bi-info-circle" aria-hidden="true"></i> Precios informativos sujetos a actualización.</span><span>Sistema CSM · Consulta rápida</span></footer>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/theme-handler.js"></script>
  <script src="assets/js/price_consultation.js"></script>
</body>
</html>
